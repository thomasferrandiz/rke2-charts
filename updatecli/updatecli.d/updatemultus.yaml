---
name: "Update Multus version" 

sources:
  multus:
    name: Get multus version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-multus
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"

  cni_plugins:
    name: Get CNI plugins version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-cni-plugins
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"

  network_controller:
    name: Get dynamic network controller version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-multus-dynamic-networks-controller
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"

  mirrored_network_controller:
    name: Get mirrored dynamic network controller version
    kind: dockerimage
    spec:
      image: rancher/mirrored-k8snetworkplumbingwg-multus-dynamic-networks-controller
      # Only match plain semver tags (ignore arch-suffixed tags)
      tagfilter: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
      versionfilter:
        kind: semver

  multi_networkpolicy:
    name: Get multi-networkpolicy-nftables version
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-multi-networkpolicy-nftables
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        # pattern accepts any semver constraint
        pattern: "v[0-9]+.[0-9]+.[0-9]+-build[0-9]+"

  mirrored_multi_networkpolicy:
    name: Get mirrored multi-networkpolicy-nftables version
    kind: dockerimage
    spec:
      image: rancher/mirrored-k8snetworkplumbingwg-multi-networkpolicy-nftables
      # Only match plain semver tags (ignore arch-suffixed tags)
      tagfilter: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
      versionfilter:
        kind: semver


targets:
  multusImage:
    name: "Bump to latest multus version in the chart"
    kind: shell
    scmid: default
    sourceid: multus
    spec:
      command: 'updatecli/scripts/update-multus.sh'
      environments:
        - name: MULTUS_VERSION
          value: '{{ source "multus" }}'
        - name: CNI_PLUGINS_VERSION
          value: '{{ source "cni_plugins" }}'
        - name: NETWORK_CONTROLLER_VERSION
          value: '{{ source "network_controller" }}'
        - name: MIRRORED_NETWORK_CONTROLLER_VERSION
          value: '{{ source "mirrored_network_controller" }}'
        - name: MULTI_NETWORKPOLICY_VERSION
          value: '{{ source "multi_networkpolicy" }}'
        - name: MIRRORED_MULTI_NETWORKPOLICY_VERSION
          value: '{{ source "mirrored_multi_networkpolicy" }}'
        - name: PATH
        - name: UPDATECLI_GITHUB_WORKFLOW_URL
        - name: GH_TOKEN

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      
actions:
  default:
    title: 'Update Multus version to {{ source "multus" }}, CNI plugins to {{ source "cni_plugins" }}, dynamic network controller to {{ source "network_controller" }} , mirrored dynamic network controller to {{ source "mirrored_network_controller" }}, multi-networkpolicy-nftables to {{ source "multi_networkpolicy" }} and mirrored multi-networkpolicy-nftables to {{ source "mirrored_multi_networkpolicy" }}'
    kind: github/pullrequest
    spec:
      strategy:
        method: manual
      labels:
        - updatecli
    scmid: default
